<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — ZeroHours</title>
<meta name="description" content="Need help with ZeroHours? Send us a message and we&#x27;ll get back to you by email.">
<meta property="og:title" content="Support — ZeroHours">
<meta property="og:description" content="Need help with ZeroHours? Send us a message and we&#x27;ll get back to you by email.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zerohours.store/support/">
<meta name="twitter:card" content="summary">

<link rel="canonical" href="https://zerohours.store/support/">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css?v=4">

</head>
<body>
<main class="min-h-screen bg-background px-4 py-12 sm:px-6 sm:py-20">
  <div class="mx-auto max-w-xl">
    <a href="/" class="text-sm font-semibold text-muted-foreground hover:text-foreground">← Back to ZeroHours</a>
    <h1 class="mt-6 font-display text-3xl font-extrabold tracking-tight text-foreground sm:text-4xl">How can we help?</h1>
    <p class="mt-3 text-muted-foreground">Tell us what's going on and we'll reply to your email. If it's about a purchase, use the email you checked out with.</p>
    <form name="support" method="POST" action="/support/sent/" data-netlify="true" netlify-honeypot="website" class="mt-8 grid gap-4 rounded-2xl border border-border bg-card p-5 sm:p-6">
      <input type="hidden" name="form-name" value="support">
      <label class="grid gap-1.5 text-sm font-semibold text-foreground">Name (optional)<input name="name" maxlength="100" class="w-full rounded-xl border border-border bg-card px-4 py-3 text-base text-foreground outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></label>
      <label class="grid gap-1.5 text-sm font-semibold text-foreground">Your email<input name="email" type="email" required maxlength="200" class="w-full rounded-xl border border-border bg-card px-4 py-3 text-base text-foreground outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></label>
      <label class="grid gap-1.5 text-sm font-semibold text-foreground">Topic
        <select name="topic" required class="w-full rounded-xl border border-border bg-card px-4 py-3 text-base text-foreground outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"><option>Can&#x27;t unlock the app</option><option>Didn&#x27;t get my receipt</option><option>Refund question</option><option>Bug or problem</option><option>Something else</option></select>
      </label>
      <label class="grid gap-1.5 text-sm font-semibold text-foreground">Message<textarea name="message" required minlength="10" maxlength="3000" rows="6" class="w-full rounded-xl border border-border bg-card px-4 py-3 text-base text-foreground outline-none focus:border-primary focus:ring-2 focus:ring-primary/20"></textarea></label>
      <p hidden><label>Leave this empty <input name="website" tabindex="-1" autocomplete="off"></label></p>
      <button type="submit" class="rounded-xl bg-primary px-5 py-3.5 font-display font-bold text-primary-foreground transition hover:opacity-90 disabled:opacity-60">Send message</button>
    </form>
  </div>
</main>
</body>
</html>
